[package]
name = "music-tag-transfer"
version = "0.1.0"
edition = "2024"
description = "Resolve Spotify tracks, download exact audio pairs with synced lyrics, and manage ID3 metadata"

[dependencies]
id3 = "1.16.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
