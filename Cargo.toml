[package]
name = "music-tag-transfer"
version = "0.1.0"
edition = "2024"
description = "Resolve and download Spotify links, then manage ID3 metadata recursively"

[dependencies]
id3 = "1.16.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = "thin"
strip = true
