[package]
name = "music-tag-transfer"
version = "0.1.0"
edition = "2024"
description = "Download Spotify and YouTube Music through spotDL, clean synced lyrics, standardise ID3 tags, and maintain a local music library"

[dependencies]
id3 = "1.16.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
whatlang = "0.18.0"

[profile.release]
lto = "thin"
strip = true
